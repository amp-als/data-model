# ALL ALS value-level date screening gate. Changes require data governance review.
# Dates are blocked in every column unless that normalized column name is listed
# below. Add raw ALL ALS view-specific exceptions under by_view when necessary.
version: 1
allowed_columns:
  all_files:
    - collection_date
    - assessment_date
    - Mhstdat
    - Mhendat
    - Prendat
    - Cmstdat
    - Cmmhno
    - Cmdose
    - Pralsgt_tdate
    - Crplsdat
  # Applies to all ASSESS/PREVENT raw view names, respectively. These fields
  # contain known non-PHI date-like values and are exempt from date detection.
  by_view_prefix:
    v_ALLALS_AS:
      - mh_clin_dat
      - mhevdtyp_diagnosis
      - ecasoc
      - prindc
      - prstdat
      - mhterm
      - cdnaloc
      - pralsgt_nr_approxdat
      - dsreasos
    v_ALLALS_PR:
      - cdnaloc
      - pralsgt_nr_approxdat
      - prstdat
      - ms_rue_nvorres
      - ms_rue_othsp
  by_view: {}

# These columns from v_ALLALS_AS_ASSEHHD.csv intentionally remain screened for
# date-like PHI. They are not allowlisted above:
# - radm_mkreasndos
# - rapb_mkreasndos
# - rfdi_mkreasndos
