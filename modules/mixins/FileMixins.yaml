#######################################
# File Mixins
# Reusable attribute groups for different file types
#######################################

classes:
  FileAnnotationsMixin:
    mixin: true
    description: Mixin for biological annotation and analysis method attributes shared across file types
    attributes:
      annotations:
        title: Biological Annotations
        range: AnnotationTypeEnum
        description: Types of biological databases and annotations referenced in this file.
        multivalued: true
        required: false
      analysisTypes:
        title: Analysis Types
        range: AnalysisMethodEnum
        description: Computational and statistical analysis methods applied to the data.
        multivalued: true
        required: false

  ClinicalFileMixin:
    mixin: true
    description: Mixin for clinical file specific attributes
    mixins: [FileAnnotationsMixin]
    slots:
      - clinicalDomain
      - studyPhase
    attributes:
      visitType:
        title: Visit Type
        range: VisitTypeEnum
        description: Type of clinical visit (baseline, follow-up, etc.)
        multivalued: true
        required: false

  OmicFileMixin:
    mixin: true
    description: Mixin for omic file specific attributes
    mixins: [FileAnnotationsMixin]
    slots:
      - assay
      - libraryLayout
      - libraryPreparationMethod
      - librarySource
      - GEOSuperSeries
      - FACSPopulation
      - alignmentMethod

  RecordSetFileMixin:
    mixin: true
    description: >
      Mixin for aggregate ("record set") files that contain data for many
      subjects/samples in a single file (e.g. tabular exports, expression
      matrices) rather than one file per subject/sample.
    slots:
      - participant_count
      - recordCount
      - studyType
      - completenessLevel
      - hasLongitudinalData
      - keyMeasures
      - viewName

  FileSetFileMixin:
    mixin: true
    description: >
      Mixin for individual ("file set") files scoped to a single subject or
      sample (one file per entity) rather than a multi-subject/sample record set.
    mixins: [SubjectIdentifierMixin]
