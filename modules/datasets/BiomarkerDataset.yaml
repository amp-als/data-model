#######################################
# Biomarker Dataset Schema
# For aggregate-level ALS biomarker data collections
#######################################

classes:
  BiomarkerDataset:
    is_a: BaseDataset
    mixins: [SpecimenTypeMixin, BiomarkerDataMixin]
    description: >
      Dataset containing aggregate-level ALS biomarker data generated by one or more
      vendors or laboratories.
    slots:
      - assay
      - assayTarget
      - platform
      - vendor
      - clinicalDomain
      - assessmentType
      - studyPhase
      - keyMeasures
      - hasLongitudinalData
    attributes:
      dataType:
        title: Data Type
        range: BiomarkerDataTypeEnum
        description: Biomarker data types and processing levels included in this dataset.
        multivalued: true
        required: false

# Enums for this class are defined canonically in dedicated modules and shared with
# BiomarkerFile (see Makefile BiomarkerDataset target):
#   BiomarkerDataTypeEnum -> modules/biomarker/data-types.yaml
#   VendorEnum            -> modules/reference/vendors.yaml
