#######################################
# Clinical File Schema
# For clinical data files (assessments, visits, etc.)
#######################################

classes:
  ClinicalFile:
    is_a: BaseFile
    abstract: true
    mixins: [ClinicalFileMixin]
    description: >
      Abstract base for files containing clinical data such as assessments, visits,
      treatments, or medical history. Shared by the aggregate (ClinicalRecordSetFile)
      and individual (ClinicalFileSetFile) variants below.
    slots:
      - fileFormat
      - assessmentType
      - administrationMode
      - site_of_onset
    attributes:
      # Clinical-specific data types
      dataType:
        title: Data Type
        range: ClinicalDataTypeEnum
        description: Clinical data types (assessments, treatments, medical history, etc.)
        multivalued: true
        required: false
      datasetReference:
        title: Dataset Reference
        range: string
        description: Reference to dataset this file belongs to
        multivalued: true
        required: false

  ClinicalRecordSetFile:
    is_a: ClinicalFile
    mixins: [RecordSetFileMixin]
    description: >
      Clinical file that aggregates records across many subjects in a single file
      (e.g. a tabular assessment export or dataset-level CSV/TSV extract with one
      row per subject/visit), rather than one file per subject.
    attributes:
      subjectIdColumn:
        title: Subject ID Column
        range: string
        description: Name of the column containing subject identifiers
        multivalued: true
        required: false

  ClinicalFileSetFile:
    is_a: ClinicalFile
    mixins: [FileSetFileMixin]
    description: >
      Clinical file scoped to a single subject (e.g. a per-subject case report
      form export or single-subject longitudinal record), rather than a
      multi-subject table.
