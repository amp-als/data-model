#######################################
# GEO File Schema
# Omic file sourced from NCBI GEO (Gene Expression Omnibus).
#
# Every sequencing GEO record is also deposited in SRA, so a GEO file IS an SRA
# file with additional GEO accessions. GEOFile therefore specializes SRAFile
# (is_a SRAFile -> OmicFile) and adds only the GEO Series/Sample identifiers via
# GEOFileMixin. The inverse does not hold: an SRA file need not have a GEO record.
#######################################

classes:
  GEOFile:
    is_a: SRAFile
    mixins: [GEOFileMixin]
    description: >
      File containing omic data sourced from NCBI GEO (Gene Expression Omnibus),
      annotated with GEO Series (GSE) and Sample (GSM) accessions. Specializes
      SRAFile, inheriting all SRA/NCBI identifiers and omic file fields.

# GEO identifiers (GSE, GSM) are defined canonically in modules/geo_sra/geo.yaml.
# SRA/NCBI identifiers and omic file fields are inherited from SRAFile
# (modules/datasets/SRAFile.yaml -> OmicFile).
