# Dataset data-category and Sankey registry.
# dataCategory is the union of category values for selected dataType and
# assessmentTypes entries. The Sankey notebook consumes sankeyRole to select
# typed middle nodes; it is not a LinkML validation rule.
#
# sankeyRole values:
#   broad     retained compatibility/modality value; excluded from middle nodes
#   granular  content-bearing middle node included in the Sankey
#   technical supporting/processing value excluded from middle nodes
#
# Unmapped values require review. A broad-only dataset is reported as
# "Needs Granular Classification" by the Sankey workflow.

